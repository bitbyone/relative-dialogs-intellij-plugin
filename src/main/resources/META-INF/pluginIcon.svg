    <rect x="92.279" y="90.825" width="315.198" height="318.732" style="stroke-width: 33; paint-order: fill; stroke-linejoin: round; stroke-linecap: round; fill-rule: nonzero; stroke: rgb(20, 20, 20); fill: rgb(77, 139, 178); filter: url(&quot;#drop-shadow-filter-0&quot;);"/>
    <text style="fill: url(&quot;#pattern-0-0&quot;); fill-opacity: 0.9; font-family: &quot;SauceCodePro Nerd Font&quot;; font-size: 240px; font-weight: 700; paint-order: fill; stroke: rgb(251, 251, 251); stroke-dashoffset: 7px; stroke-linecap: round; stroke-linejoin: round; stroke-miterlimit: 1; stroke-width: 5px; white-space: pre;" x="236.489" y="334.942">D</text>
    <text style="fill: url(&quot;#pattern-0-1&quot;); fill-opacity: 0.9; font-family: &quot;SauceCodePro Nerd Font&quot;; font-size: 240px; font-weight: 700; paint-order: fill; stroke: rgb(251, 251, 251); stroke-dashoffset: 7px; stroke-linecap: round; stroke-linejoin: round; stroke-miterlimit: 1; stroke-width: 5px; white-space: pre;" transform="matrix(-1, 0, 0, 1, 0, 0)" x="-264.63" y="334.942">R</text>
